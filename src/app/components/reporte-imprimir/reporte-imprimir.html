<main class="page reporte">
  <div class="bar no-print">
    <button type="button" class="btn btn-line" (click)="cerrar()">Cerrar</button>
    <button type="button" class="btn btn-primary" (click)="imprimir()">Imprimir o guardar como PDF</button>
  </div>
  <header class="report-head">
    <div>
      <div class="brand"><img src="logo.svg" alt=""><span class="brand-name">One Joyería</span></div>
      <h1>{{ titulo }}</h1>
    </div>
    <div class="report-meta">{{ categoria() }}<br>{{ detalle() }}<br>Generado el {{ generado }}</div>
  </header>

  @if (error()) {
    <div class="error-box">{{ error() }}</div>
  } @else if (movimientos(); as lista) {
    <app-tabla-movimientos [movimientos]="lista" />
  } @else if (piezas(); as lista) {
    <app-tabla-inventario [piezas]="lista" />
  } @else {
    <div class="loading">Preparando reporte…</div>
  }
</main>
