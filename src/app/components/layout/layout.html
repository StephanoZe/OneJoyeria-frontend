<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/panel" aria-label="One Joyería, ir al panel">
      <img src="logo.svg" alt="">
      <span class="brand-name">One Joyería</span>
    </a>
    <nav class="nav" aria-label="Secciones">
      <a routerLink="/panel" routerLinkActive="activo" ariaCurrentWhenActive="page">Panel</a>
      <a routerLink="/inventario" routerLinkActive="activo" ariaCurrentWhenActive="page">Inventario</a>
      <a routerLink="/proveedores" routerLinkActive="activo" ariaCurrentWhenActive="page">Proveedores</a>
      <a routerLink="/alertas" routerLinkActive="activo" ariaCurrentWhenActive="page">
        Alertas
        @if (productoService.contadorAlertas() > 0) {
          <span class="count" [attr.aria-label]="productoService.contadorAlertas() + ' piezas por reponer'">{{ productoService.contadorAlertas() }}</span>
        }
      </a>
      <a routerLink="/reportes" routerLinkActive="activo" ariaCurrentWhenActive="page">Reportes</a>
    </nav>
    <div class="session">
      <span class="session-name">{{ auth.sesion()?.nombre }}</span>
      <button type="button" (click)="salir()">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>

<div class="toasts" role="status" aria-live="polite">
  @for (a of avisoService.avisos(); track a.id) {
    <div class="toast" [class.error]="a.error">{{ a.texto }}</div>
  }
</div>
